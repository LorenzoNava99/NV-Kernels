name: Build Custom NVIDIA 6.18 Kernel for DGX Spark

on:
  push:
    branches:
      - custom-ubuntu-nvidia-6.18
  pull_request:
    branches:
      - custom-ubuntu-nvidia-6.18
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick-test

env:
  KERNEL_VERSION: "6.18.0"
  KERNEL_LOCALVERSION: "-nvidia-dgxspark-custom"

jobs:
  # Native ARM64 build (following NVIDIA's approach)
  build-arm64-kernel:
    name: ARM64 Native Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            cpio \
            kmod \
            rsync \
            dwarves \
            zstd \
            python3 \
            debhelper \
            fakeroot \
            dpkg-dev

      - name: Configure kernel
        run: |
          # Start with ARM64 defconfig
          if [[ -f debian.nvidia/config/config.common.ubuntu ]]; then
            echo "Using Ubuntu NVIDIA config files"
            cat debian.nvidia/config/config.common.ubuntu > .config
            cat debian.nvidia/config/arm64/config.common.arm64 >> .config 2>/dev/null || true
            cat debian.nvidia/config/arm64/config.flavour.nvidia >> .config 2>/dev/null || true
            make olddefconfig
          else
            echo "Using default ARM64 defconfig"
            make defconfig
          fi

          # Set local version
          ./scripts/config --set-str LOCALVERSION "${{ env.KERNEL_LOCALVERSION }}"
          ./scripts/config --disable LOCALVERSION_AUTO

          # Completely disable all cert/signing requirements for simpler build
          ./scripts/config --disable MODULE_SIG
          ./scripts/config --disable MODULE_SIG_ALL
          ./scripts/config --disable MODULE_SIG_FORCE
          ./scripts/config --disable SYSTEM_TRUSTED_KEYRING
          ./scripts/config --disable SECONDARY_TRUSTED_KEYRING
          ./scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          ./scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          ./scripts/config --disable MODULE_SIG_KEY_TYPE_RSA
          ./scripts/config --disable MODULE_SIG_KEY_TYPE_ECDSA
          ./scripts/config --set-str MODULE_SIG_KEY ""

          # Disable integrity subsystem (also triggers cert builds)
          ./scripts/config --disable INTEGRITY
          ./scripts/config --disable INTEGRITY_SIGNATURE
          ./scripts/config --disable INTEGRITY_ASYMMETRIC_KEYS
          ./scripts/config --disable IMA
          ./scripts/config --disable IMA_APPRAISE
          ./scripts/config --disable EVM

          # Disable lockdown (can require signed modules)
          ./scripts/config --disable SECURITY_LOCKDOWN_LSM
          ./scripts/config --disable LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY

          # Disable kexec signing (also uses certs)
          ./scripts/config --disable KEXEC_SIG
          ./scripts/config --disable KEXEC_BZIMAGE_VERIFY_SIG

          ./scripts/config --disable WERROR

          # Enable ARM64 optimizations
          ./scripts/config --enable ARM64_LSE_ATOMICS
          ./scripts/config --enable ARM64_USE_LSE_ATOMICS

          # DGX Spark / Blackwell support
          ./scripts/config --enable DRM
          ./scripts/config --enable PCI
          ./scripts/config --enable PCI_MSI
          ./scripts/config --enable ZONE_DMA
          ./scripts/config --enable ZONE_DMA32
          ./scripts/config --enable NUMA
          ./scripts/config --enable ZONE_DEVICE
          ./scripts/config --enable MEMORY_HOTPLUG
          ./scripts/config --enable DEBUG_INFO_BTF

          make olddefconfig

          echo "=== Config summary ==="
          grep -E "^CONFIG_(LOCALVERSION|ARM64_LSE|ZONE_DEVICE)" .config || true

      - name: Quick test build
        if: github.event.inputs.build_type == 'quick-test'
        run: |
          make -j$(nproc) headers_check
          echo "Quick test passed"

      - name: Build kernel
        if: github.event.inputs.build_type != 'quick-test'
        run: |
          echo "=== Building kernel on native ARM64 ==="
          echo "CPU count: $(nproc)"

          # Check OpenSSL headers availability
          echo "Checking OpenSSL headers..."
          pkg-config --cflags openssl || echo "pkg-config failed, headers may be missing"
          ls -la /usr/include/openssl/bio.h || echo "OpenSSL bio.h not found at standard location"

          # If extract-cert fails to build, create a dummy one
          # This is a common workaround when cert infrastructure is disabled
          mkdir -p certs
          if [ ! -f certs/extract-cert ]; then
            cat > certs/extract-cert << 'DUMMY'
          #!/bin/bash
          # Dummy extract-cert - certificate extraction disabled
          echo "Warning: extract-cert is a stub (certs disabled)" >&2
          exit 0
          DUMMY
            chmod +x certs/extract-cert
          fi

          # Build kernel image
          make -j$(nproc) Image.gz || {
            echo "Image.gz build failed, retrying with V=1 for more details..."
            make -j1 V=1 Image.gz 2>&1 | tail -100
            exit 1
          }

          # Build modules
          make -j$(nproc) modules

          # Build DTBs
          make -j$(nproc) dtbs || echo "DTBs optional"

          echo "=== Kernel build complete ==="

      - name: Create and collect Debian packages
        if: github.event.inputs.build_type != 'quick-test'
        run: |
          echo "=== Creating Debian packages ==="

          export KDEB_PKGVERSION="${{ env.KERNEL_VERSION }}-1"
          export KDEB_SOURCENAME="linux-nvidia-dgxspark"
          export KDEB_COMPRESS="xz"

          # Build Debian packages
          make -j$(nproc) bindeb-pkg

          # Create packages directory and collect all .deb files
          mkdir -p packages

          # Find and copy ALL .deb files from parent directory
          echo "=== Looking for packages ==="
          ls -la ../*.deb 2>/dev/null || true

          # Copy packages
          cp ../*.deb packages/ 2>/dev/null || true

          # Also check current directory
          cp *.deb packages/ 2>/dev/null || true

          # Verify
          echo "=== Collected packages ==="
          ls -la packages/

          PKG_COUNT=$(find packages -name "*.deb" | wc -l)
          echo "Total packages: $PKG_COUNT"

          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "WARNING: No packages found. Searching..."
            find /home -name "linux-image*.deb" -ls 2>/dev/null | head -5
            find /home -name "*.deb" -ls 2>/dev/null | head -20
            # Try to copy from wherever they are
            find /home -maxdepth 5 -name "linux-*.deb" -exec cp {} packages/ \; 2>/dev/null || true
            ls -la packages/
          fi

      - name: Upload kernel packages
        if: github.event.inputs.build_type != 'quick-test'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-arm64
          path: packages/*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Upload kernel image
        if: github.event.inputs.build_type != 'quick-test'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-arm64
          path: |
            arch/arm64/boot/Image.gz
          retention-days: 30

      - name: Build summary
        if: github.event.inputs.build_type != 'quick-test'
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel Version:** ${{ env.KERNEL_VERSION }}${{ env.KERNEL_LOCALVERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** ARM64 (native build)" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** NVIDIA DGX Spark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages" >> $GITHUB_STEP_SUMMARY
          ls -la packages/*.deb 2>/dev/null | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done || echo "No packages found" >> $GITHUB_STEP_SUMMARY

  create-release:
    needs: build-arm64-kernel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/custom-ubuntu-nvidia-6.18' && github.event.inputs.build_type != 'quick-test'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-packages-arm64
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.KERNEL_VERSION }}-nvidia-custom-${{ github.run_number }}
          name: Custom NVIDIA Kernel ${{ env.KERNEL_VERSION }} for DGX Spark
          body: |
            ## Custom NVIDIA 6.18 Kernel for DGX Spark

            Native ARM64 build following NVIDIA's official workflow approach.

            ### Installation
            ```bash
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb
            sudo update-grub
            sudo reboot
            ```

            Build #${{ github.run_number }} | Commit: ${{ github.sha }}
          files: packages/*.deb
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
